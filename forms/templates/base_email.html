<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Email from NovaNest{% endblock %}</title>
</head>
<body style="margin:0;padding:0!important;background-color:#ffffff">
    <table border="0" align="center" cellpadding="0" cellspacing="0" width="600" style="width:600px;max-width:600px;font-family:'Roboto',Arial,sans-serif">
        <tbody>
            <!-- HEADER -->
            <tr>
                <td>
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tbody>
                            <tr>
                                <td style="padding:20px 20px 10px 20px">
                                    <img style="width:70px;" src="{% block logo_url %}https://www.NovaNac.com/static/images/nova-nest-academy.png{% endblock %}" alt="Nova Nest Academy Logo">
                                </td>
                                <td style="font-weight:200;font-size:12px;color:#666;text-align:right;padding:20px 20px 10px 20px">
                                    {% block date %}{% now "F j, Y" %}{% endblock %}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <hr style="margin:10px 20px;border:none;border-top:1px solid #e0e0e0">
                </td>
            </tr>

            <!-- CONTENT -->
            <tr>
                <td>
                    <table style="padding:10px 30px" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tbody>
                            <tr>
                                <td style="font-weight:bold;color:#403f3f;font-size:20px">
                                    <p>Dear {{ first_name }},</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="color:#333;font-size:14px;line-height:1.6">
                                    {% block content %}{% endblock %}
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-top:20px;color:#333;font-size:14px">
                                    <p>Best regards,<br><strong>NovaNest Academy Team</strong></p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>

            <!-- FOOTER -->
            <tr>
                <td>
                    <table style="background-color:#e9f6ff;margin:35px 0 0 0;width:100%;padding:20px" cellpadding="0" cellspacing="0" border="0">
                        <tbody>
                            <tr>
                                <td style="padding:10px 20px;vertical-align:top">
                                    <p style="margin:0 0 5px 0"><strong>Nova Nest Academy</strong></p>
                                    <p style="margin:0 0 3px 0">Website: <a href="https://www.NovaNac.com" style="color:#0066cc;text-decoration:none">www.NovaNac.com</a></p>
                                    <p style="margin:0">Email: <a href="mailto:info@NovaNac.com" style="color:#0066cc;text-decoration:none">info@NovaNac.com</a></p>
                                </td>
                                <td style="padding:10px 20px;vertical-align:top;text-align:right">
                                    <a href="https://www.linkedin.com/company/novanac" style="text-decoration:none">
                                        <img width="24" height="24" src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                                    </a>
                                    <a href="https://www.instagram.com/novanac" style="text-decoration:none">
                                        <img width="24" height="24" src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>

            <!-- DISCLAIMER -->
            <tr>
                <td style="padding:15px 20px;text-align:center">
                    <p style="margin:0;font-size:11px;color:#999">This is an automated message, please do not reply.</p>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
